name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Required for Nerdbank.GitVersioning commit height

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install docfx
        run: dotnet tool install --global docfx

      - name: Install WASM AOT tools
        shell: pwsh
        run: |
          # setup-dotnet installs an SDK; global.json selects it over newer runner SDKs.
          $sdkVersion = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $sdkVersion -notmatch '^10\.0\.') {
            throw "The website requires the .NET 10 SDK; selected '$sdkVersion'."
          }
          Write-Host "Selected .NET SDK: $sdkVersion"
          # The default interpreter build discovers no AOT workload to restore.
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) { throw "Installing wasm-tools failed." }

      - name: Verify AOT workload before building docs
        run: dotnet restore Xui/Apps/TestApp/TestApp.Browser.csproj -p:Configuration=Release -p:RunAOTCompilation=true -p:WasmStripILAfterAOT=true

      - name: Build docs and published WASM apps
        shell: pwsh
        run: ./tools/build-web.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install playground browser tests
        working-directory: Xui/Compiler/Playground/browser-tests
        run: |
          npm ci
          npx playwright install chromium --only-shell

      - name: Test published playground
        working-directory: Xui/Compiler/Playground/browser-tests
        run: npm test -- "${{ github.workspace }}/_site/wasm/compiler"

      - name: Install TestApp browser tests
        working-directory: Xui/Runtime/Browser/browser-tests
        run: |
          npm ci
          npx playwright install chromium --only-shell

      - name: Test published AOT TestApp at /wasm/
        working-directory: Xui/Runtime/Browser/browser-tests
        env:
          XUI_EXPECT_AOT: '1'
        run: npm test -- "${{ github.workspace }}/_site/wasm"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            Xui/Runtime/Browser/browser-tests/artifacts
            Xui/Compiler/Playground/browser-tests/artifacts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
