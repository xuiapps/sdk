name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Required for Nerdbank.GitVersioning commit height

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install docfx
        run: dotnet tool install --global docfx

      - name: Generate docs SVGs
        run: dotnet test Xui/Tests/Docs/Xui.Tests.Docs.csproj --configuration Release

      - name: Generate API metadata
        run: docfx metadata docfx.json

      - name: Build site
        run: docfx build docfx.json

      - name: Publish WASM playground
        run: dotnet publish Xui/Compiler/Playground/Xui.Compiler.Playground.csproj --configuration Release --output artifacts/playground

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install playground browser tests
        working-directory: Xui/Compiler/Playground/browser-tests
        run: |
          npm ci
          npx playwright install chromium --only-shell

      - name: Test published playground
        working-directory: Xui/Compiler/Playground/browser-tests
        run: npm test -- "${{ github.workspace }}/artifacts/playground/wwwroot"

      - name: Add playground to Pages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _site/wasm | Out-Null
          Copy-Item artifacts/playground/wwwroot/* _site/wasm -Recurse -Force
          New-Item -ItemType File -Force _site/.nojekyll | Out-Null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
