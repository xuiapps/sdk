name: Memory Tests

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Build native allocation-stack profiler
      run: |
        cmake -S Xui/Utils/AllocationProfiler -B Xui/Utils/AllocationProfiler/bin/native
        cmake --build Xui/Utils/AllocationProfiler/bin/native --config Release
    - name: Run isolated allocation regressions and stdio process checks
      shell: pwsh
      run: |
        if ($IsWindows) {
          $env:XUI_TEST_ALLOCATION_PROFILER = (Resolve-Path Xui/Utils/AllocationProfiler/bin/native/Release/XuiAllocationProfiler.dll).Path
        } else {
          $env:XUI_TEST_ALLOCATION_PROFILER = (Resolve-Path Xui/Utils/AllocationProfiler/bin/native/libXuiAllocationProfiler.dylib).Path
        }
        dotnet test Xui/Tests/Memory/Xui.Tests.Memory.csproj -c Debug --logger trx --results-directory TestResults/Memory
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: memory-${{ matrix.os }}
        path: TestResults/Memory/
